<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>دخول الإدارة — Materials-Tarbia</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <img src="logo.png" alt="شعار الكلية" class="auth-logo">
      <span class="eyebrow">لوحة الإدارة</span>
      <h1>تسجيل دخول المسؤول</h1>
      <p>بعد تسجيل الدخول سيتم تحويلك مباشرة إلى صفحة إضافة الملفات.</p>
      <form id="loginForm">
        <label>الإيميل<input id="email" type="email" autocomplete="username" required placeholder="admin@gmail.com"></label>
        <label>الباسورد<input id="password" type="password" autocomplete="current-password" required placeholder="•••••••••••"></label>
        <button class="primary" type="submit">دخول المكتبة<span>←</span></button>
        <p id="loginMessage" class="message" role="alert"></p>
      </form>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
